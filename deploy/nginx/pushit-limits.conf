# Zones de limitation de débit — contexte `http`.
#
# Installé dans /etc/nginx/conf.d/pushit-limits.conf. Une zone `limit_req_zone`
# ne peut pas être déclarée dans un bloc `server`, d'où ce fichier séparé ; les
# `limit_req` qui l'utilisent vivent dans deploy/nginx/pushit-api.conf.
#
# `pushit_admin_login` protège /admin/login/, qui est une vue Django ordinaire et
# échappe donc aux limiteurs DRF de l'API. 10r/m par IP : largement au-dessus de
# l'usage humain (quelques tentatives), très en dessous de ce qu'exige une
# attaque par dictionnaire.
limit_req_zone $binary_remote_addr zone=pushit_admin_login:10m rate=10r/m;
