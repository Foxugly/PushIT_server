name: Test & Deploy

on:
  push:
    branches: [main]
  # Sans ça une PR n'est jamais verifiee : on ne decouvrait une suite cassee
  # qu'apres le merge, sur la branche qui deploie. Seul `test` tourne ici,
  # `deploy` restant garde par son `if: github.ref == 'refs/heads/main'`.
  pull_request:

concurrency:
  # Les deploiements se serialisent entre eux ; les runs de PR non, sinon une PR
  # ferait la queue derriere un deploiement en cours.
  group: >-
    ${{ github.ref == 'refs/heads/main' && 'deploy-production'
        || format('test-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    # La suite tournait sur SQLite alors que la production tourne sur
    # PostgreSQL 16. Ce n'est pas un detail ici : `DB_SUPPORTS_ROW_LOCKING`
    # (config/settings/base.py) est calcule depuis le moteur, et NEUF sites de
    # code branchent dessus — tous les chemins `select_for_update` n'etaient
    # donc jamais exerces. C'est exactement cette famille qui a produit deux
    # incidents de production sur QuizOnline (PR #152 et #153 la-bas).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pushit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          STATE: TEST
          SECRET_KEY: test-secret-key
          MEDIA_ROOT_DIR: media
          # Convention DB_* 6 variables de la flotte (OPERATIONS.md §3.13).
          DB_ENGINE: postgresql
          DB_NAME: pushit
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: pytest -q -m "not integration"

  # Le parcours complet sur base neuve : migrations, inscription, application,
  # rattachement, envoi. Il ne tournait NULLE PART — exclu ici par son marqueur,
  # et cassé en local par un PYTHONPATH absent. C'est pourtant le seul test qui
  # attrape ce que les unitaires ne voient pas : une migration qui ne passe pas
  # sur une base vierge, un câblage rompu, un script d'exemple devenu faux —
  # c'est ainsi qu'on a vu que `full_flow.py` émettait encore avec le jeton
  # hérité, éteint depuis.
  integration:
    runs-on: ubuntu-latest
    # « Base neuve » ne veut rien dire sur SQLite : ce qu'on veut prouver, c'est
    # que les migrations s'appliquent sur le moteur de production. La fixture
    # `fresh_database_env` cree et detruit une base PostgreSQL jetable.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pushit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the end-to-end flow on a fresh database
        env:
          STATE: DEV
          SECRET_KEY: test-secret-key
          MEDIA_ROOT_DIR: media
          DB_ENGINE: postgresql
          DB_NAME: pushit
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: pytest -q -m integration

  deploy:
    needs: [test, integration]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    permissions:
      id-token: write    # mint the OIDC token to assume the deploy role
      contents: read

    steps:
      # Deploy is OIDC -> SSM (no long-lived SSH key). AWS-RunShellScript runs as
      # root and invokes deploy.sh as django (git reset, pip, migrate,
      # collectstatic, perms, restart via the pushit-deploy sudoers grant) — same
      # work as the old SSH deploy. Secrets stay in SSM (/pushit/prod/*), fetched
      # to /run/pushit/.env at boot by pushit-env-fetch and sourced by deploy.sh.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1
          role-session-name: gh-actions-${{ github.run_id }}

      - name: Trigger deploy on EC2 via SSM
        id: ssm
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          cat > /tmp/ssm-params.json <<'EOF'
          { "commands": [
            "sudo -u django bash -c 'umask 027; cd /var/www/django_websites/PushIT_server && git fetch --quiet origin main && git reset --hard --quiet origin/main'",
            "sudo -u django bash /var/www/django_websites/PushIT_server/deploy/deploy.sh"
          ], "executionTimeout": ["900"] }
          EOF
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy pushit ${{ github.sha }}" \
            --cloud-watch-output-config CloudWatchOutputEnabled=true \
            --parameters file:///tmp/ssm-params.json \
            --query Command.CommandId --output text)
          echo "Command ID: $CMD_ID"
          echo "cmd_id=$CMD_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for SSM command to finish
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          CMD_ID: ${{ steps.ssm.outputs.cmd_id }}
        run: |
          for _ in $(seq 1 180); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success)
                echo "::group::stdout"
                aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
                echo "::endgroup::"
                exit 0 ;;
              Failed|Cancelled|TimedOut)
                echo "Deploy $STATUS"
                echo "::group::stdout"
                aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
                echo "::endgroup::"
                echo "::group::stderr"
                aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text
                echo "::endgroup::"
                exit 1 ;;
              *) sleep 5 ;;
            esac
          done
          echo "Timed out waiting for SSM command after 15 minutes"
          exit 1
